name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the chat.zulip.org snapshot four times a day so the Pages
  # deployment tracks the live feed even without a code change.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Pull environment secrets (GH_ACTIONS_BOT_API_KEY lives here) into
    # the build job. The deploy job below scopes itself to the same env.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Fetch chat.zulip.org announce snapshot
        # The script no-ops when credentials aren't configured, so it's
        # safe to run unconditionally; continue-on-error protects deploys
        # against transient chat.zulip.org failures.
        continue-on-error: true
        env:
          ZULIP_ANNOUNCE_EMAIL: ${{ secrets.ZULIP_ANNOUNCE_EMAIL }}
          ZULIP_ANNOUNCE_API_KEY: ${{ secrets.GH_ACTIONS_BOT_API_KEY }}
          ZULIP_ANNOUNCE_SERVER: ${{ vars.ZULIP_ANNOUNCE_SERVER || 'https://chat.zulip.org' }}
        run: node scripts/fetch-announce-snapshot.mjs

      - name: Fetch chat.zulip.org channels + topics snapshot
        # Backs the <zulip-channel-list> / <zulip-topic-list> demos with
        # real subscription + topic data. Same credentials and no-op
        # fallback as the messages fetcher above.
        continue-on-error: true
        env:
          ZULIP_ANNOUNCE_EMAIL: ${{ secrets.ZULIP_ANNOUNCE_EMAIL }}
          ZULIP_ANNOUNCE_API_KEY: ${{ secrets.GH_ACTIONS_BOT_API_KEY }}
          ZULIP_ANNOUNCE_SERVER: ${{ vars.ZULIP_ANNOUNCE_SERVER || 'https://chat.zulip.org' }}
        run: node scripts/fetch-channels-topics-snapshot.mjs

      - name: Build static site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build:site

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter example (web)
        working-directory: packages/flutter/example
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/flutter/"

      - name: Copy Flutter build into site
        run: |
          mkdir -p site/flutter
          cp -R packages/flutter/example/build/web/. site/flutter/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
