name: Release to npm

# Publishes the three workspace packages to the npm registry in
# topological order: zulip-embed → zulip-embed-react → zulip-embed-react-native.
#
# Triggers:
#   - workflow_dispatch: manual run. Dry-run unless `dryRun: false` is
#     explicitly passed — the default is safe because it's invoked from
#     the Actions UI where nuance is easy to miss.
#   - push of a `v*` tag (e.g. `v0.8.0-rc.0`): real publish. The tag
#     name must exactly match the root package.json version or the job
#     fails before touching the registry.
#
# First publish is manual (dryRun: true) so the workflow gets validated
# against a pristine tarball layout before a tag is cut. Once green we
# enable NPM_TOKEN and push the first tag.
#
# Supply-chain posture:
#   - `NPM_CONFIG_PROVENANCE=true` is set on the publish step so npm
#     attaches a Sigstore provenance attestation to every published
#     tarball (also gated by `publishConfig.provenance` in each
#     package.json).
#   - Before publish, `scripts/release.mjs` computes sha256 SRI hashes
#     and gzipped sizes for every dist artifact; the resulting
#     `dist/INTEGRITY.json` + `dist/INTEGRITY.md` are uploaded as
#     workflow artifacts and — on tag push — spliced into the README
#     between the `sri:start` / `sri:end` markers.

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run `npm publish --dry-run` instead of publishing. Default true."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a follow-up SRI commit can be made against
          # the tagged ref rather than a shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # Build + bundle-size gate before anything touches the registry.
      # Same steps CI runs on every PR — keeps the release a no-op
      # against a dirty tree.
      - run: pnpm -w run build
      - run: pnpm check:bundle

      # Compute SRI hashes + gzipped sizes for every dist artifact
      # before the workspace packages build — if this step fails the
      # release is aborted before npm ever sees a tarball.
      - name: Compute SRI manifest
        run: node scripts/release.mjs

      - name: Upload integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: integrity-manifest
          path: |
            dist/INTEGRITY.json
            dist/INTEGRITY.md
          if-no-files-found: error

      - name: Build workspace packages
        run: |
          pnpm --filter zulip-embed-react run build
          pnpm --filter zulip-embed-react-native run build

      # For tag pushes, verify the tag name matches the root package
      # version. A mismatch is almost always a bad cherry-pick or a
      # stale rebase; fail loud rather than publish a 0.7.9 tag that
      # ships 0.8.0-rc.0 code.
      - name: Verify tag matches root version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Determine publish flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dryRun }}" = "false" ]; then
            echo "dry=" >> "$GITHUB_OUTPUT"
            echo "mode=live" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "dry=" >> "$GITHUB_OUTPUT"
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish in topological order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sigstore provenance attestation; also gated by
          # publishConfig.provenance in each package.json.
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          echo "Publishing mode: ${{ steps.flags.outputs.mode }}"
          # Flag `--access public` is required on a fresh unscoped
          # package too when the org enforces explicit access level;
          # harmless to pass otherwise.
          pnpm publish --access public --no-git-checks ${{ steps.flags.outputs.dry }}
          pnpm --filter zulip-embed-react publish --access public --no-git-checks ${{ steps.flags.outputs.dry }}
          pnpm --filter zulip-embed-react-native publish --access public --no-git-checks ${{ steps.flags.outputs.dry }}

  # Separate job so `contents: write` is scoped to SRI splicing only —
  # the publish job above stays locked down to `contents: read`.
  sri-readme:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - run: node scripts/release.mjs

      - name: Splice SRI table into README
        run: node scripts/splice-sri.mjs
        shell: bash

      - name: Commit + push SRI hashes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README SRI table already up to date — nothing to commit."
            exit 0
          fi
          git add README.md
          git commit -m "chore(release): update SRI hashes for ${VERSION} [skip ci]"
          git push origin main
