name: zulip_embed
description: >-
  First-class Flutter widgets for embedding Zulip chat into any Flutter app.
  Framework-native, no WebView, with a pluggable transport so you can run
  against a live Zulip server or the in-process demo transport.
version: 0.1.0
repository: https://github.com/amanagr/zulip-embed
issue_tracker: https://github.com/amanagr/zulip-embed/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
